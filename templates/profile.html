{% import "_icons.html" as icons %}
{% extends "base.html" %}
{% block title %}Profile &mdash; Heart Disease Prediction{% endblock %}

{% block content %}
<h1 class="page-title">{{ icons.icon('user', 'title-icon') }}My Profile</h1>
<p class="page-subtitle">
  Username: <strong>{{ record.username }}</strong> &middot; Role: {{ record.role }}
</p>
<hr class="divider">

<div class="panel">
  <div class="panel-title">Account Details</div>
  <form method="post" action="{{ url_for('profile') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-grid">
      <div class="field">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname"
               value="{{ record.fullname or '' }}" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email"
               value="{{ record.email or '' }}" required>
      </div>
      <div class="field">
        <label for="new_password">New Password</label>
        <input type="password" id="new_password" name="new_password"
               placeholder="Leave blank to keep current password">
      </div>
      <div class="field">
        <label for="confirm_password">Confirm New Password</label>
        <input type="password" id="confirm_password" name="confirm_password">
      </div>
    </div>
    <button type="submit" class="btn mt-2">Save Changes</button>
  </form>
</div>
{% endblock %}
