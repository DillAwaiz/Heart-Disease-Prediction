{% extends "base.html" %}
{% block title %}Bad Request{% endblock %}
{% block content %}
<div class="error-page">
  <div class="error-code">400</div>
  <div class="error-title">Bad Request</div>
  <div class="error-text">{{ message or "The request could not be processed. Please go back and try again." }}</div>
  <a href="{{ url_for('index') }}" class="btn">Back to Home</a>
</div>
{% endblock %}
